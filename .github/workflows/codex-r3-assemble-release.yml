name: Verify public R3 downloads
on:
  push:
    branches: [codex/release-upload-20261112-r3]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify anonymous latest APIs and public download links
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          for repo in ['SomJsA/HyperHLE_ds_compat-pc','SomJsA/HyperHLE_ds_compat-android']:
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/releases/latest?verify='+str(int(time.time())),headers={'Accept':'application/vnd.github+json','User-Agent':'DeadSpaceMobile-PublicVerification'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert response.status==200
                  release=json.load(response)
              assert release['tag_name']=='20261112-r3' and not release['draft'] and not release['prerelease']
              print('ANONYMOUS_LATEST_OK',repo,release['tag_name'],flush=True)
              binaries=[a for a in release['assets'] if a['name'].endswith(('.apk','.exe'))]
              assert len(binaries)==(1 if repo.endswith('-pc') else 2)
              for asset in binaries:
                  with urllib.request.urlopen(urllib.request.Request(asset['browser_download_url'],method='HEAD'),timeout=30) as response:
                      assert response.status==200
                      assert int(response.headers['Content-Length'])==asset['size']
                  print('PUBLIC_DOWNLOAD_OK',asset['name'],asset['size'],asset['digest'],flush=True)
          PY
